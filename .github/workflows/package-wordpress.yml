# Reusable: package a WordPress plugin or theme with wptoolkit-build (Track P). Call it from the
# plugin's or theme's own repository:
#
#   # .github/workflows/release.yml in your plugin
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     package:
#       uses: codad5/wptoolkit/.github/workflows/package-wordpress.yml@v1.0.0
#       permissions:
#         contents: write
#       with:
#         node-build: npm run build     # optional
#
# It needs codad5/wptoolkit in the project's composer.json (it brings vendor/bin/wptoolkit-build) and
# reads wptoolkit.json if present. On a tag, the zip and its .sha256 are attached to the release.
name: Package WordPress project

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP used to build.
        type: string
        default: '8.1'
      node-version:
        description: Node used when node-build is set.
        type: string
        default: '20'
      node-build:
        description: A command to build assets before packaging, e.g. "npm run build".
        type: string
        default: ''
      directory:
        description: The plugin or theme directory inside the repository.
        type: string
        default: '.'
    outputs:
      zip:
        description: Path of the zip, relative to the repository.
        value: ${{ jobs.package.outputs.zip }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      zip: ${{ steps.build.outputs.zip }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none
      - if: inputs.node-build != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-build != ''
        run: npm ci && ${{ inputs.node-build }}

      # Dev dependencies included: the build tool is one. The zip itself gets a --no-dev install.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/wptoolkit-build doctor

      - id: build
        run: |
          vendor/bin/wptoolkit-build package | tee build.log
          zip="$(ls dist/*.zip | head -n 1)"
          vendor/bin/wptoolkit-build verify "$zip"
          echo "zip=${{ inputs.directory }}/$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            ${{ inputs.directory }}/dist/*.zip
            ${{ inputs.directory }}/dist/*.zip.sha256

      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.zip.sha256 --clobber
