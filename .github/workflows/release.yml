# Publishes a release when a version tag is pushed (Phase 7, ADR-0011):
#   1. every CI gate (unit, integration on real WordPress, E2E) passes on the tagged commit;
#   2. the tag matches Application::VERSION and the JS client's VERSION;
#   3. WPToolkit's own build tool builds the standalone zip (+ .sha256) and verifies it;
#   4. a GitHub Release is created with the zip, its checksum and notes from Conventional Commits.
#
# No Packagist step: Composer installs from this repository (`"type": "vcs"`).
# Cut a release:  php bin/set-version.php 1.0.0 → commit → git tag v1.0.0 → git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish ${{ github.ref_name }}
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: The tag, PHP and the JS client agree on the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "public const VERSION = '${version}';" src/Foundation/Application.php \
            || { echo "::error::Application::VERSION is not ${version}. Run php bin/set-version.php ${version}"; exit 1; }
          grep -q "var VERSION = '${version}';" resources/js/client.js \
            || { echo "::error::resources/js/client.js VERSION is not ${version}. Run php bin/set-version.php ${version}"; exit 1; }

      - name: Build the standalone zip with wptoolkit-build
        run: php bin/build-release.php --expect="${GITHUB_REF_NAME}"

      - name: Verify the zip
        run: php packages/build/bin/wptoolkit-build verify "dist/wptoolkit-${GITHUB_REF_NAME#v}.zip"

      - name: Release notes
        run: php bin/changelog.php "" "${GITHUB_REF_NAME}" > release-notes.md && cat release-notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "dist/wptoolkit-${GITHUB_REF_NAME#v}.zip" \
            "dist/wptoolkit-${GITHUB_REF_NAME#v}.zip.sha256" \
            --title "WPToolkit ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag ${prerelease}
