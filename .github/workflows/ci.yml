# The gates every change to 1.0 passes (Phase 0, ADR-0010). One job per
# concern, so a red run says which concern failed.
name: CI

on:
  push:
    branches: [next, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate composer.json and audit dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit

  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php bin/lint.php src legacy tests bin

  guard:
    # ADR-0013: the guard must parse on servers too old for the library, so it can fail politely.
    name: Guard parses on PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l bootstrap/guard.php

  cs:
    name: Coding standards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2, cs2pr
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
      - name: Guard uses only PHP 5.6 syntax
        run: vendor/bin/phpcs -q --standard=PHPCompatibility --runtime-set testVersion 5.6- bootstrap/guard.php

  analyse:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer analyse -- --no-progress --error-format=github

  i18n:
    name: Translation template is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer i18n
      # Timestamp, generator and "#: file:line" location lines churn; any other difference means a
      # library string changed without regenerating languages/wptoolkit.pot (run: composer i18n).
      - name: Template matches the source
        run: |
          git diff --exit-code -I 'POT-Creation-Date' -I 'X-Generator' -I '^#: ' -- languages/

  js:
    name: JavaScript client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check resources/js/client.js
      - run: node --test tests/js/*.test.mjs

  integration:
    # Adapters against a real WordPress + MySQL (wp-env tests container), PHPUnit 10 with a
    # wp-load.php bootstrap (ADR-0010 amendment).
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        wp: ['6.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - name: Pin PHP and WordPress for this matrix cell
        run: |
          core='null'
          if [ "${{ matrix.wp }}" != "latest" ]; then core='"WordPress/WordPress#${{ matrix.wp }}"'; fi
          echo "{\"phpVersion\": \"${{ matrix.php }}\", \"core\": ${core}}" > .wp-env.override.json
          cat .wp-env.override.json
      - run: npm run e2e:start
      - run: composer test:integration

  e2e:
    # Phase 1 Definition of Done on a real WordPress: safe boot (ADR-0013) and coexistence of two
    # WPToolkit versions (ADR-0005, ADR-0020).
    name: End-to-end (WordPress in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Playwright drives the runner's preinstalled Google Chrome (playwright.config.ts sets
      # channel: 'chrome' on CI), so nothing is downloaded or apt-installed here.
      - run: google-chrome --version
      - run: npm run e2e:start
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      # The lock-free install resolves for the 8.1 platform pin; newer PHPs run the same set.
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
